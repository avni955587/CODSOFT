<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <h2 class="logo">👗 Fashion</h2>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#products">Collections</a></li>
      <li><a href="#">Cart</a></li>
      <li><a href="#">Account</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Content -->
  <div class="content">

    <!-- Hero Section -->
    <section class="hero">
      <h1>New Season Collection</h1>
      <p>Style that defines you 🔥</p>
      <button class="hero-btn">Shop Now</button>
    </section>

    <!-- Search -->
    <div class="search-container">
      <input type="text" placeholder="Search outfits...">
      <button>Search</button>
    </div>

    <!-- Products -->
    <h2 id="products" class="section-title">Trending Styles</h2>

    <div class="products">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1521334884684-d80222895322" alt="">
        <h3>₹1999</h3>
        <p>Men's Casual Jacket</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b" alt="">
        <h3>₹1499</h3>
        <p>Women's Stylish Dress</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="">
        <h3>₹999</h3>
        <p>Denim Jeans</p>
        <button class="buy-btn">Buy Now</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b" alt="">
        <h3>₹799</h3>
        <p>Oversized T-Shirt</p>
        <button class="buy-btn">Buy Now</button>
      </div>

    </div>

    <footer class="footer">
      <p>© 2026 Fashion Store | Designed by You</p>
    </footer>

  </div>

</body>
</html>
